[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-castle-research"
version = "0.1.0"
description = "Falsification-first simulator for navigation under bounded reactive topology rewiring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
