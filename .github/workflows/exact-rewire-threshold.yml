name: exact-rewire-threshold

on:
  push:
    branches:
      - research/exact-rewire-threshold
  workflow_dispatch:

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: pytest
      - name: Solve exact finite rewiring game
        run: python experiments/run_exact_rewire_threshold.py --out results/exact_rewire_threshold.csv
      - uses: actions/upload-artifact@v4
        with:
          name: exact-rewire-threshold
          path: |
            results/exact_rewire_threshold.csv
            results/exact_rewire_threshold.json
