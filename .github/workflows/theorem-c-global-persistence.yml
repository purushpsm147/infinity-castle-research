name: theorem-c-global-persistence

on:
  pull_request:
    paths:
      - "src/infinity_castle/global_persistence.py"
      - "tests/test_global_persistence.py"
      - "experiments/run_theorem_c_global_persistence.py"
      - "docs/theorem-c-global-persistence.md"
      - ".github/workflows/theorem-c-global-persistence.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: pytest
      - name: Validate Theorem C global-persistence foothold
        run: python experiments/run_theorem_c_global_persistence.py
      - uses: actions/upload-artifact@v4
        with:
          name: theorem-c-global-persistence
          path: |
            results/theorem_c_global_persistence.csv
            results/theorem_c_global_persistence.json
