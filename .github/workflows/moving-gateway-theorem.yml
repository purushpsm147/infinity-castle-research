name: moving-gateway-theorem

on:
  push:
    branches:
      - research/moving-gateway-theorem
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: pytest
      - name: Validate moving-gateway threshold certificates
        run: python experiments/run_moving_gateway_theorem.py
      - uses: actions/upload-artifact@v4
        with:
          name: moving-gateway-theorem
          path: |
            results/moving_gateway_theorem.csv
            results/moving_gateway_theorem.json
